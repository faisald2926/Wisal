<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="t"><title id="t">إقراران مستقلان على نسخة طلب واحدة</title><rect width="1000" height="240" rx="18" fill="#f7f8f4"/><g font-family="Segoe UI,Tahoma,Arial" text-anchor="middle"><text x="500" y="34" fill="#172b3a" font-size="20" font-weight="700">المنظم يتابع، والطرفان يقرّان</text><g fill="#e9f3ec" stroke="#cee0d1"><rect x="660" y="66" width="260" height="63" rx="12"/><rect x="80" y="66" width="260" height="63" rx="12"/></g><g fill="#172b3a" font-size="18"><text x="790" y="103">إقرار المقدم من دوره</text><text x="210" y="103">إقرار صاحب الطلب من دوره</text></g><path d="M660 98H530v52M340 98h130v52" stroke="#16725c" stroke-width="2" fill="none"/><rect x="350" y="150" width="300" height="51" rx="12" fill="#16725c"/><text x="500" y="181" font-size="18" fill="#fff">الاثنان + نفس النسخة = منجز</text><text x="500" y="98" font-size="14" fill="#6e7e85">قبول الطرفين أولًا</text><text x="500" y="226" font-size="12" fill="#6e7e85">تعديل الطلب أو القدرة يبطل إقرار النسخة السابقة. دعوة مستخدمة لا تصدر دورًا جديدًا.</text></g></svg>
