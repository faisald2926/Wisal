<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="t d"><title id="t">رحلة وِصال</title><desc id="d">دائرة معارف، قدرات وأوقات، طلبات، اقتراح، اتفاق، تنفيذ وإقراران</desc><rect width="1000" height="220" rx="18" fill="#f7f8f4"/><g font-family="Segoe UI,Tahoma,Arial" text-anchor="middle" fill="#172b3a"><text x="500" y="35" font-size="20" font-weight="700">رحلة المساندة في دائرة معارف</text><g fill="#e9f3ec" stroke="#cee0d1"><rect x="819" y="69" width="153" height="85" rx="12"/><rect x="627" y="69" width="153" height="85" rx="12"/><rect x="435" y="69" width="153" height="85" rx="12"/><rect x="243" y="69" width="153" height="85" rx="12"/><rect x="51" y="69" width="153" height="85" rx="12"/></g><g font-size="18"><text x="895" y="106">دائرة معارف</text><text x="703" y="106">قدرات وطلبات</text><text x="511" y="106">اقتراح ممكن</text><text x="319" y="106">قبول الطرفين</text><text x="127" y="106">تنفيذ وإقراران</text></g><g font-size="12" fill="#6e7e85"><text x="895" y="132">بالغون · أسماء مستعارة</text><text x="703" y="132">رغبة ووقت وسعة</text><text x="511" y="132">تغطية ثم عبء ثم فرص</text><text x="319" y="132">صلاحية مستقلة لكل طرف</text><text x="127" y="132">إنجاز مسجل بعد الاثنين</text></g><g fill="#16725c" font-size="26"><text x="800" y="119">←</text><text x="607" y="119">←</text><text x="415" y="119">←</text><text x="224" y="119">←</text></g><text x="500" y="189" font-size="13" fill="#6e7e85">التنسيق والتنفيذ خارج الموقع. الاقتراح وحده لا يُحسب مساندة منجزة.</text></g></svg>
