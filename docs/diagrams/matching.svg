<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="255" viewBox="0 0 1000 255" role="img" aria-labelledby="t"><title id="t">مرشحات التوزيع وأولويات الهدف</title><rect width="1000" height="255" rx="18" fill="#f7f8f4"/><g font-family="Segoe UI,Tahoma,Arial" text-anchor="middle"><text x="500" y="34" font-size="20" font-weight="700" fill="#172b3a">الموافقة والقيود قبل التوزيع</text><g fill="#fff" stroke="#d9e4da"><rect x="755" y="60" width="220" height="53" rx="10"/><rect x="510" y="60" width="220" height="53" rx="10"/><rect x="265" y="60" width="220" height="53" rx="10"/><rect x="20" y="60" width="220" height="53" rx="10"/></g><g fill="#172b3a" font-size="15"><text x="865" y="91">راغب · ليس صاحب الطلب</text><text x="620" y="91">قدرة تطابق الحاجة</text><text x="375" y="91">نافذة وقت متوافقة</text><text x="130" y="91">سعة متبقية كافية</text></g><path d="M500 118v23" stroke="#16725c" stroke-width="2"/><rect x="105" y="145" width="790" height="56" rx="12" fill="#172b3a"/><text x="500" y="180" font-size="17" fill="#fff">تغطية أكبر ← عبء تربيعي أقل ← فرص موزعة ← حسم تعادل ثابت</text><text x="500" y="230" font-size="13" fill="#6e7e85">تعداد كامل ضمن ٦ أعضاء و٦ طلبات. العبء المقبول والمنجز يدخل الحساب بالسعات الأصلية.</text></g></svg>
